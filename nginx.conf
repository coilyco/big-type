# big type: one static page served by unprivileged nginx (replaces
# /etc/nginx/conf.d/default.conf). TLS terminates upstream at traefik +
# cert-manager; this server speaks plain HTTP on 8080. Shape follows
# coilyco/factory-game-v3's nginx.conf minus the wasm and hashed-bundle rules.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 512;

    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Nothing is content-hashed, so the page, the worker and the manifest all
    # revalidate; a deploy lands on the next load. Location-level add_header
    # replaces the server-level set, so the security headers repeat.
    location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)?$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }

    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
